    // dependencies are compile-time stubs only; R8 removes their unreachable callers.
    compileOnly 'androidx.core:core-ktx:1.13.1'
    compileOnly 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    compileOnly 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    compileOnly 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    compileOnly 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    compileOnly 'androidx.activity:activity-compose:1.9.1'
    compileOnly platform('androidx.compose:compose-bom:2025.06.00')
    compileOnly 'androidx.compose.ui:ui:1.9.0'
    compileOnly 'androidx.compose.ui:ui-graphics:1.9.0'
    compileOnly 'androidx.compose.ui:ui-tooling-preview:1.9.0'
    compileOnly 'androidx.compose.material3:material3'
    compileOnly 'androidx.collection:collection:1.5.0'
    compileOnly 'com.google.android.material:material:1.12.0'
    compileOnly 'androidx.appcompat:appcompat:1.7.0'
    compileOnly 'androidx.constraintlayout:constraintlayout:2.1.4'
    compileOnly 'androidx.navigation:navigation-compose:2.10.0-alpha02'
    compileOnly 'androidx.autofill:autofill:1.1.0'
    compileOnly 'androidx.window:window:1.3.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'sh.calvin.reorderable:reorderable:3.0.0'
    compileOnly project(':voiceinput-shared')
    compileOnly 'com.google.protobuf:protobuf-javalite:3.8.0'
    compileOnly 'com.google.guava:guava:33.4.8-android'
    compileOnly(name: 'mozc-release', ext: 'aar')
    compileOnly files(rootProject.file('libs/rime-release.aar'))

}
